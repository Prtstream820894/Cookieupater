name: Update Star Vijay Fun Games Cookie

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cookie:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch Cookie and Update cookie.txt
        env:
          PLAYLIST_URL: "https://game.playindia.fun/Jtv/XdEFdV/Playlist.m3u"
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          import requests

          playlist_url = os.environ["PLAYLIST_URL"]
          print("Fetching playlist...")

          try:
              headers = {"User-Agent": "Mozilla/5.0"}
              response = requests.get(playlist_url, headers=headers, timeout=30)
              response.raise_for_status()
          except requests.RequestException as e:
              print(f"Playlist fetch failed: {e}")
              sys.exit(1)

          lines = response.text.splitlines()
          raw_cookie = None

          print(f"Total lines fetched: {len(lines)}")

          for i, line in enumerate(lines):
              if "Star Vijay" in line or "Fun Games" in line:
                  print(f"Match found at line {i}: {line}")
                  for j in range(i, min(i + 15, len(lines))):
                      match = re.search(
                          r'(hdntl=[^\s|"]+)',
                          lines[j],
                          re.IGNORECASE
                      )
                      if match:
                          raw_cookie = match.group(1)
                          break
                  if raw_cookie:
                      break

          if not raw_cookie:
              print("❌ Cookie nahi mili. Playlist check karein.")
              sys.exit(1)

          clean_cookie = re.split(
              r'&(?:User-Agent|user-agent|Referer|referer|Origin|origin)=',
              raw_cookie,
              maxsplit=1
          )[0].strip().rstrip('&')

          if not clean_cookie.startswith("hdntl="):
              print("❌ Invalid cookie format.")
              sys.exit(1)

          with open("cookie.txt", "w", encoding="utf-8") as f:
              f.write(clean_cookie + "\n")

          print("✅ Cookie successfully written to cookie.txt")
          print("🍪 Cookie:", clean_cookie)
          PY

      - name: Commit and Push Updated Cookie
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]"

          git add cookie.txt

          if git diff --cached --quiet; then
            echo "Cookie text is same, forcing timestamp update..."
            date -u > .last_updated
            git add .last_updated
            git commit -m "Auto refresh cookie timestamp [skip ci]"
          else
            git commit -m "Update Star Vijay Fun Games cookie [skip ci]"
          fi

          git push
